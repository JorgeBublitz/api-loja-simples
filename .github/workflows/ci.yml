name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-e-testes:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 3. Restore
        run: dotnet restore

      - name: 4. Build
        run: dotnet build --no-restore --configuration Release

      - name: 5. Testes
        run: dotnet test --no-build --configuration Release --verbosity normal

  sast-semgrep:
    name: SAST 1 (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Executar Semgrep e validar achados
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config p/csharp \
            --config p/javascript \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --error \
            --sarif \
            --output /src/semgrep-results.sarif \
            /src

      - name: 3. Publicar relatorio SAST (Semgrep SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-report
          path: semgrep-results.sarif
          if-no-files-found: warn

  sast-devskim:
    name: SAST 2 (Microsoft DevSkim)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 3. Instalar Microsoft DevSkim CLI
        run: dotnet tool install --global Microsoft.CST.DevSkim.CLI

      - name: 4. Executar DevSkim e validar achados criticos/importantes
        run: |
          devskim analyze \
            --source-code . \
            --output-file devskim-results.sarif \
            --output-format sarif \
            --severity Critical,Important \
            --ignore-globs "**/bin/**,**/obj/**,**/.git/**" \
            --exit-code-is-num-issues

      - name: 5. Publicar relatorio SAST (DevSkim SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-devskim-report
          path: devskim-results.sarif
          if-no-files-found: warn

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [build-e-testes, sast-semgrep, sast-devskim]

    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 3. Build da API
        run: dotnet build src/ApiLoja.csproj --configuration Release

      - name: 4. Subir API em background e aguardar healthcheck
        run: |
          nohup dotnet run --project src/ApiLoja.csproj --no-build --configuration Release --urls http://127.0.0.1:5000 > api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "API pronta na tentativa $i"
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: 5. Executar OWASP ZAP API Scan (OpenAPI) e validar
        run: |
          mkdir -p zap-reports
          cp .zap/rules.tsv zap-reports/rules.tsv
          set +e
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://127.0.0.1:5000/swagger/v1/swagger.json \
            -f openapi \
            -c rules.tsv \
            -r zap-api-report.html \
            -J zap-api-report.json
          ZAP_EXIT=$?
          set -e
          echo "ZAP API Scan exit code: $ZAP_EXIT"
          if [ "$ZAP_EXIT" -ne 0 ] && [ "$ZAP_EXIT" -ne 2 ]; then
            echo "Falha na validacao DAST (API Scan): alertas criticos/altos encontrados."
            exit "$ZAP_EXIT"
          fi

      - name: 6. Executar OWASP ZAP Baseline Scan (Interface Web) e validar
        run: |
          set +e
          docker run --rm --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5000/ \
            -c rules.tsv \
            -r zap-web-report.html \
            -J zap-web-report.json
          ZAP_EXIT=$?
          set -e
          echo "ZAP Baseline Scan exit code: $ZAP_EXIT"
          if [ "$ZAP_EXIT" -ne 0 ] && [ "$ZAP_EXIT" -ne 2 ]; then
            echo "Falha na validacao DAST (Web Baseline): alertas criticos/altos encontrados."
            exit "$ZAP_EXIT"
          fi

      - name: 7. Encerrar API
        if: always()
        run: |
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi

      - name: 8. Publicar relatorios DAST (OWASP ZAP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-dast-reports
          path: zap-reports/
          if-no-files-found: warn
